# Free Supabase projects pause after about a week without activity.
# A read-only check every 3 days wasn't enough (the project paused on 2026-10-10),
# so this now writes to the database once a day via ping_keepalive()
# (see supabase/keepalive.sql).
# If the project has paused anyway, the run fails and GitHub emails you:
# resume it from the Supabase dashboard.
#
# GitHub also switches off scheduled workflows in public repos after 60 days
# without commits, so once a month this adds an empty commit (no file changes).
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 12 * * *'     # 12:17 UTC every day
    - cron: '41 6 1 * *'      # 06:41 UTC on the 1st: monthly empty commit
  workflow_dispatch:           # adds a "Run workflow" button for a manual test
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Write a timestamp to the database
        env:
          # Same public values as config.js; row-level security keeps all data private.
          SUPABASE_URL: https://dbyffaqhdtqulfximmaq.supabase.co
          SUPABASE_KEY: sb_publishable_XUDIwMFw_mXN34QuxJD_WA_7s-JJwC2
        run: |
          body=$(curl -sS -w '\nHTTP %{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/ping_keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}') \
            || { echo "Could not reach Supabase. The project is probably paused: resume it from the dashboard."; exit 1; }
          echo "$body"
          echo "$body" | tail -n1 | grep -q 'HTTP 200'

  stay-enabled:
    if: github.event.schedule == '41 6 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Empty commit so GitHub keeps this schedule on
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Monthly keep-alive (no changes)"
          git push
